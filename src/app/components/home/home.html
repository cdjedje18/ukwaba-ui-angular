<div class="login-container">

    <mat-card class="login-card add-org-card" routerLink="/create-organization">

        <mat-card-content>

            <div class="status-check add-org-action">
                <span>+ Add New Organization</span>
            </div>

        </mat-card-content>
    </mat-card>

    @for (item of organizations(); track item.id) {
      <mat-card class="login-card" [routerLink]="['/organizations', item.id]">
          <mat-card-header>
              <mat-card-title>{{ item.name }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
              <div class="status-check">
                  <span><strong>ID:</strong> {{ item.id }}</span>
              </div>
          </mat-card-content>
      </mat-card>
    }

</div>
